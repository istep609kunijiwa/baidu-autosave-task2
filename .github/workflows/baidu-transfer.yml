name: Baidu Transfer Task

on:
  schedule:
  - cron: '17 0 * * *'
  - cron: '17 12 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

concurrency:
  group: baidu-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-24.04
    env:
      GITHUB_ACTIONS: 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          constraints.txt

    - name: Install dependencies
      run: bash scripts/install_dependencies.sh runtime

    - name: Check encrypted failed state key
      id: failed_state
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        if [ -n "$TRANSFERSHARE_STATE_KEY" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "TRANSFERSHARE_STATE_KEY 未配置，跳过跨 run 失败清单持久化"
        fi

    - name: Restore encrypted failed state
      if: steps.failed_state.outputs.enabled == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          .transfershare_failed_transfers.json.enc
          .transfershare_mirror_state.json.enc
        key: transfershare-failed-state-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          transfershare-failed-state-${{ github.ref_name }}-

    - name: Decrypt failed state
      if: steps.failed_state.outputs.enabled == 'true' && hashFiles('.transfershare_failed_transfers.json.enc', '.transfershare_mirror_state.json.enc') != ''
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        set -euo pipefail
        key_file="$(mktemp)"
        trap 'rm -f "$key_file"' EXIT
        printf '%s' "$TRANSFERSHARE_STATE_KEY" > "$key_file"
        chmod 600 "$key_file"
        for state_file in .transfershare_failed_transfers.json .transfershare_mirror_state.json; do
          encrypted_file="${state_file}.enc"
          [ -f "$encrypted_file" ] || continue
          if openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$encrypted_file" -out "$state_file" -pass file:"$key_file"; then
            chmod 600 "$state_file"
            echo "已恢复加密状态: $state_file"
          else
            rm -f "$state_file"
            echo "无法解密状态，已跳过: $state_file"
          fi
        done

    - name: Run transfer task
      timeout-minutes: 30
      env:
        BAIDU_COOKIES: ${{ secrets.BAIDU_COOKIES }}
        SHARE_URLS: ${{ secrets.SHARE_URLS }}
        SAVE_DIR: ${{ secrets.SAVE_DIR }}
        WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        FOLDER_FILTER: ${{ secrets.FOLDER_FILTER }}
        EXCLUDE_FOLDER_FILTER: ${{ secrets.EXCLUDE_FOLDER_FILTER }}
        REGEX_PATTERN: ${{ secrets.REGEX_PATTERN }}
        REGEX_REPLACE: ${{ secrets.REGEX_REPLACE }}
        TRANSFERSHARE_MIRROR_DELETE: ${{ secrets.TRANSFERSHARE_MIRROR_DELETE }}
        TRANSFERSHARE_FAILED_STATE_ENABLED: ${{ steps.failed_state.outputs.enabled }}
        TRANSFERSHARE_MIRROR_STATE_ENABLED: ${{ steps.failed_state.outputs.enabled }}
        TRANSFERSHARE_SHARED_SCAN_CONCURRENCY: "10"
        TRANSFERSHARE_LOCAL_SCAN_CONCURRENCY: "4"
        TRANSFERSHARE_SCAN_BATCH_SIZE: "1000"
        TRANSFERSHARE_TRANSFER_FLUSH_SIZE: "50"
      run: |
        echo "开始执行转存任务"
        echo "超时时间: 30 分钟"
        echo "========================================"
        ./scripts/run_transfer_task.sh

    - name: Encrypt failed state
      if: always() && steps.failed_state.outputs.enabled == 'true'
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        set -euo pipefail
        key_file="$(mktemp)"
        trap 'rm -f "$key_file"' EXIT
        printf '%s' "$TRANSFERSHARE_STATE_KEY" > "$key_file"
        chmod 600 "$key_file"
        encrypt_state() {
          state_file="$1"
          default_json="$2"
          encrypted_file="${state_file}.enc"
          tmp_state="$(mktemp)"
          tmp_encrypted="$(mktemp)"
          if [ -s "$state_file" ]; then
            cp "$state_file" "$tmp_state"
          else
            printf '%s\n' "$default_json" > "$tmp_state"
          fi
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$tmp_state" -out "$tmp_encrypted" -pass file:"$key_file"
          mv "$tmp_encrypted" "$encrypted_file"
          chmod 600 "$encrypted_file"
          rm -f "$state_file" "$tmp_state"
        }
        encrypt_state .transfershare_failed_transfers.json '[]'
        encrypt_state .transfershare_mirror_state.json '{"schema_version":1,"subscriptions":{}}'

    - name: Save encrypted failed state
      if: always() && steps.failed_state.outputs.enabled == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .transfershare_failed_transfers.json.enc
          .transfershare_mirror_state.json.enc
        key: transfershare-failed-state-${{ github.ref_name }}-${{ github.run_id }}
